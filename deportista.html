<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKA Ecuador — Portal del Deportista</title>
<style>
:root {
  --fondo:         #070E1C;
  --sup:           #0C1829;
  --sup2:          #112035;
  --primario:      #14306A;
  --primario-dark: #0C1F4A;
  --acento:        #4A8FE8;
  --texto:         #DDE8F8;
  --texto-s:       #6E90B8;
  --borde:         #182C48;
  --exito:         #22C55E;
  --peligro:       #EF4444;
  --naranja:       #F59E0B;
  --blanco:        #FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--fondo);
     color:var(--texto);min-height:100vh;overflow-x:hidden}

/* ── TOAST ── */
#toast{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{padding:11px 16px;border-radius:8px;font-size:.84rem;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.4);animation:slideIn .3s ease;max-width:300px}
.toast-ok  {background:#0D3320;border:1px solid var(--exito);color:var(--exito)}
.toast-err {background:#2A0D0D;border:1px solid var(--peligro);color:var(--peligro)}
.toast-info{background:#0D1E3A;border:1px solid var(--acento);color:var(--acento)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* ─────────────────────────────── LOGIN ─────────────────────────────── */
#s-login{align-items:center;justify-content:center;
         background:radial-gradient(ellipse at 40% 30%, #0C2055 0%, #070E1C 70%)}

.login-card{background:var(--sup);border:1px solid var(--borde);border-radius:18px;
  padding:44px 36px;width:min(380px, 92vw);text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}

.login-logo{font-size:3rem;margin-bottom:8px}
.login-org{font-size:.72rem;letter-spacing:.14em;color:var(--texto-s);text-transform:uppercase;margin-bottom:6px}
.login-title{font-size:1.5rem;font-weight:700;color:var(--blanco);margin-bottom:4px}
.login-sub{font-size:.82rem;color:var(--texto-s);margin-bottom:30px}

.login-card label{display:block;font-size:.72rem;font-weight:600;color:var(--texto-s);
  text-transform:uppercase;letter-spacing:.08em;text-align:left;margin-bottom:6px}
.login-card input{width:100%;background:var(--sup2);border:1px solid var(--borde);
  color:var(--texto);padding:13px 16px;border-radius:10px;font-size:1rem;outline:none;
  transition:border-color .2s;font-family:inherit;letter-spacing:.06em;text-align:center}
.login-card input:focus{border-color:var(--acento)}
.login-card input::placeholder{color:var(--texto-s);letter-spacing:0}

.btn-login{width:100%;margin-top:20px;padding:14px;background:var(--acento);
  color:var(--blanco);border:none;border-radius:10px;font-size:.95rem;font-weight:700;
  cursor:pointer;transition:background .2s;font-family:inherit}
.btn-login:hover{background:#3070C8}
.btn-login:disabled{opacity:.5;cursor:not-allowed}

.login-badge{margin-top:24px;font-size:.72rem;color:var(--texto-s);
  display:flex;align-items:center;justify-content:center;gap:6px}
.login-badge::before,.login-badge::after{content:'';flex:1;height:1px;background:var(--borde)}

/* ─────────────────────────────── PORTAL ─────────────────────────────── */
#s-portal{flex-direction:column}

/* Header */
.header{background:var(--primario-dark);border-bottom:1px solid var(--borde);
  display:flex;align-items:center;padding:10px 20px;gap:12px;position:sticky;top:0;z-index:100}
.header-logo{font-size:1.05rem;font-weight:800;color:var(--acento);letter-spacing:.5px}
.header-sep{flex:1}
.header-user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--acento);
  display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;
  color:var(--blanco);flex-shrink:0}
.header-info{line-height:1.2}
.header-name{font-size:.88rem;font-weight:600;color:var(--blanco)}
.header-cat{font-size:.72rem;color:var(--texto-s)}
.btn-salir{background:none;border:1px solid var(--borde);color:var(--texto-s);
  padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.78rem;font-family:inherit;
  transition:all .2s}
.btn-salir:hover{border-color:var(--peligro);color:var(--peligro)}

/* Tabs */
.tabs{display:flex;background:var(--sup);border-bottom:1px solid var(--borde);padding:0 20px;gap:4px}
.tab{padding:12px 18px;font-size:.84rem;font-weight:600;color:var(--texto-s);
  cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;
  transition:color .2s,border-color .2s;white-space:nowrap}
.tab.active{color:var(--acento);border-bottom-color:var(--acento)}
.tab:hover:not(.active){color:var(--texto)}

/* Contenido principal */
.main{flex:1;padding:20px;max-width:960px;width:100%;margin:0 auto}

/* ── PANEL PERFIL ── */
.perfil-card{background:var(--sup);border:1px solid var(--borde);border-radius:14px;
  padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:20px}
.perfil-avatar{width:68px;height:68px;border-radius:14px;background:var(--primario);
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;
  color:var(--acento);flex-shrink:0;border:2px solid var(--acento)}
.perfil-info h2{font-size:1.2rem;font-weight:700;color:var(--blanco)}
.perfil-info p{font-size:.82rem;color:var(--texto-s);margin-top:3px}
.perfil-badge{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:20px;
  font-size:.72rem;font-weight:700;background:rgba(74,143,232,.15);color:var(--acento);
  border:1px solid rgba(74,143,232,.3)}
.perfil-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
.perfil-dato{background:var(--sup2);border-radius:10px;padding:12px 14px}
.perfil-dato .lbl{font-size:.68rem;font-weight:600;color:var(--texto-s);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:4px}
.perfil-dato .val{font-size:.88rem;color:var(--blanco);font-weight:500}

/* ── SECCIÓN TÍTULO ── */
.sec-title{font-size:.72rem;font-weight:700;color:var(--texto-s);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--borde)}

/* ── TARJETA PROGRAMA ── */
.prog-card{background:var(--sup);border:1px solid var(--borde);border-radius:14px;
  margin-bottom:16px;overflow:hidden}
.prog-header{padding:16px 20px;background:var(--primario-dark);display:flex;
  align-items:flex-start;justify-content:space-between;gap:12px}
.prog-nombre{font-size:1rem;font-weight:700;color:var(--blanco)}
.prog-meta{font-size:.76rem;color:var(--texto-s);margin-top:4px}
.prog-estado{padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:700;flex-shrink:0;
  margin-top:2px}
.prog-estado.activo{background:rgba(34,197,94,.15);color:var(--exito);border:1px solid rgba(34,197,94,.3)}
.prog-estado.inactivo{background:rgba(100,100,100,.15);color:var(--texto-s);border:1px solid var(--borde)}

.prog-body{padding:16px 20px}

/* Stats de asistencia */
.stats-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat-box{flex:1;min-width:100px;background:var(--sup2);border-radius:10px;
  padding:12px 14px;text-align:center}
.stat-num{font-size:1.4rem;font-weight:800;color:var(--acento)}
.stat-lbl{font-size:.68rem;color:var(--texto-s);margin-top:2px}

/* Barra de progreso */
.pct-bar-wrap{margin-bottom:16px}
.pct-label{display:flex;justify-content:space-between;font-size:.78rem;
  color:var(--texto-s);margin-bottom:6px}
.pct-num{font-weight:700;font-size:.88rem}
.pct-bar-bg{height:8px;background:var(--borde);border-radius:4px;overflow:hidden}
.pct-bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.pct-ok   .pct-num{color:var(--exito)}
.pct-ok   .pct-bar-fill{background:var(--exito)}
.pct-warn .pct-num{color:var(--naranja)}
.pct-warn .pct-bar-fill{background:var(--naranja)}
.pct-bad  .pct-num{color:var(--peligro)}
.pct-bad  .pct-bar-fill{background:var(--peligro)}

/* Calendario mini */
.cal-label{font-size:.72rem;font-weight:600;color:var(--texto-s);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:8px}
.cal-dots{display:flex;flex-wrap:wrap;gap:5px}
.cal-dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:.65rem;font-weight:600;position:relative}
.cal-dot.asistio  {background:rgba(34,197,94,.2);color:var(--exito);border:1px solid rgba(34,197,94,.4)}
.cal-dot.ausente  {background:rgba(239,68,68,.2);color:var(--peligro);border:1px solid rgba(239,68,68,.4)}
.cal-dot.sin-reg  {background:rgba(245,158,11,.15);color:var(--naranja);border:1px solid rgba(245,158,11,.3)}
.cal-dot.futura   {background:var(--sup2);color:var(--texto-s);border:1px dashed var(--borde)}
.cal-leyenda{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.ley-item{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--texto-s)}
.ley-dot{width:10px;height:10px;border-radius:3px}

/* Descripción del programa */
.prog-desc{font-size:.82rem;color:var(--texto-s);line-height:1.6;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--borde)}

/* ── MENSAJES / COMENTARIOS ── */
.msg-prog-group{margin-bottom:24px}
.msg-prog-title{font-size:.8rem;font-weight:700;color:var(--acento);margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.msg-prog-title::before{content:'';width:3px;height:14px;background:var(--acento);border-radius:2px}
.msg-list{display:flex;flex-direction:column;gap:8px}
.msg-burbuja{max-width:85%;padding:10px 14px;border-radius:12px;line-height:1.5}
.msg-burbuja.admin{background:var(--primario);margin-right:auto;border-bottom-left-radius:4px}
.msg-burbuja.club {background:var(--sup2);margin-right:auto;border-bottom-left-radius:4px}
.msg-meta{font-size:.66rem;color:rgba(255,255,255,.45);margin-bottom:4px;font-weight:600}
.msg-burbuja.admin .msg-meta{color:rgba(74,143,232,.7)}
.msg-texto{font-size:.85rem;color:var(--blanco)}
.msg-empty{font-size:.84rem;color:var(--texto-s);text-align:center;padding:30px;
  background:var(--sup);border-radius:12px;border:1px dashed var(--borde)}

/* ── LOADING ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px;gap:14px;color:var(--texto-s);font-size:.88rem}
.spinner{width:36px;height:36px;border:3px solid var(--borde);
  border-top-color:var(--acento);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── VACÍO ── */
.empty-state{text-align:center;padding:50px 20px;color:var(--texto-s)}
.empty-icon{font-size:2.8rem;margin-bottom:12px}
.empty-txt{font-size:.9rem}

/* ── RESPONSIVE ── */
@media(max-width:500px){
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .stats-row{gap:8px}
  .stat-box{min-width:80px;padding:10px}
}
</style>
</head>
<body>

<!-- ─────────── TOAST ─────────── -->
<div id="toast"></div>

<!-- ═══════════════════════════ PANTALLA LOGIN ═══════════════════════════ -->
<div class="screen active" id="s-login">
  <div class="login-card">
    <div class="login-logo">🥋</div>
    <div class="login-org">IKA Ecuador</div>
    <h1 class="login-title">Portal del Deportista</h1>
    <p class="login-sub">Consultá tus programas, asistencias y mensajes</p>

    <label for="inp-cedula">Número de Cédula</label>
    <input id="inp-cedula" type="text" placeholder="Ej: 1712345678"
           maxlength="20" autocomplete="off" inputmode="numeric"
           onkeydown="if(event.key==='Enter') doLogin()">

    <button class="btn-login" id="btn-login" onclick="doLogin()">Ingresar</button>

    <p class="login-badge">Acceso solo lectura · Tus datos son privados</p>
  </div>
</div>

<!-- ═══════════════════════════ PANTALLA PORTAL ═══════════════════════════ -->
<div class="screen" id="s-portal">

  <!-- Header sticky -->
  <header class="header">
    <div class="header-logo">🥋 IKA Ecuador</div>
    <div class="header-sep"></div>
    <div class="header-user">
      <div class="avatar" id="hdr-avatar">?</div>
      <div class="header-info">
        <div class="header-name" id="hdr-name">—</div>
        <div class="header-cat" id="hdr-cat">—</div>
      </div>
      <button class="btn-salir" onclick="salir()">Salir</button>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab active" onclick="showTab('programas', this)">📋 Mis Programas</button>
    <button class="tab" onclick="showTab('mensajes', this)">💬 Mensajes</button>
    <button class="tab" onclick="showTab('perfil', this)">👤 Mi Perfil</button>
  </nav>

  <!-- Contenido -->
  <div class="main">

    <!-- TAB: Programas -->
    <div id="tab-programas">
      <div id="programas-content">
        <div class="loading">
          <div class="spinner"></div>
          Cargando programas...
        </div>
      </div>
    </div>

    <!-- TAB: Mensajes -->
    <div id="tab-mensajes" style="display:none">
      <div id="mensajes-content">
        <div class="loading">
          <div class="spinner"></div>
          Cargando mensajes...
        </div>
      </div>
    </div>

    <!-- TAB: Perfil -->
    <div id="tab-perfil" style="display:none">
      <div id="perfil-content"></div>
    </div>

  </div>
</div>

<script>
// ── Estado global ──────────────────────────────────────────────────────────
let SOC = null;  // datos del deportista logueado

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, tipo='ok', ms=3000) {
  const c = document.getElementById('toast');
  const d = document.createElement('div');
  d.className = `toast-item toast-${tipo}`;
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => { d.style.animation='fadeOut .4s forwards'; setTimeout(()=>d.remove(),400); }, ms);
}

// ── API helper ─────────────────────────────────────────────────────────────
async function api(method, url, body=null) {
  try {
    const opts = { method, headers: {'Content-Type':'application/json'} };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(url, opts);
    const data = await r.json();
    return { ok: r.ok, data, status: r.status };
  } catch(e) {
    toast('Error de conexión con el servidor.', 'err');
    return null;
  }
}

// ── Escape HTML ────────────────────────────────────────────────────────────
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── LOGIN ──────────────────────────────────────────────────────────────────
async function doLogin() {
  const cedula = document.getElementById('inp-cedula').value.trim();
  if (!cedula) { toast('Ingresá tu número de cédula.', 'err'); return; }
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Verificando...';
  const r = await api('POST', '/deportista/login', { cedula });
  btn.disabled = false; btn.textContent = 'Ingresar';
  if (!r) return;
  if (!r.ok) { toast(r.data.error || 'Cédula no encontrada.', 'err'); return; }
  SOC = r.data;
  iniciarPortal();
}

// ── Iniciar portal ─────────────────────────────────────────────────────────
function iniciarPortal() {
  // Header
  const ini = (SOC.nombres[0]||'?') + (SOC.apellidos[0]||'');
  document.getElementById('hdr-avatar').textContent = ini.toUpperCase();
  document.getElementById('hdr-name').textContent   = `${SOC.nombres} ${SOC.apellidos}`;
  document.getElementById('hdr-cat').textContent    = `${SOC.categoria} · ${SOC.club_nombre}`;

  // Mostrar portal
  document.getElementById('s-login').classList.remove('active');
  document.getElementById('s-portal').classList.add('active');

  cargarProgramas();
  cargarMensajes();
  renderPerfil();
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function showTab(id, btn) {
  ['programas','mensajes','perfil'].forEach(t => {
    document.getElementById(`tab-${t}`).style.display = t === id ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── CARGAR PROGRAMAS ───────────────────────────────────────────────────────
async function cargarProgramas() {
  const el = document.getElementById('programas-content');
  const r  = await api('GET', `/deportista/programas?socio_id=${SOC.socio_id}&club_id=${SOC.club_id}`);
  if (!r || !r.ok) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p class="empty-txt">${esc(r?.data?.error || 'Error al cargar programas.')}</p></div>`;
    return;
  }
  const progs = r.data;
  if (!progs.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><p class="empty-txt">Aún no estás inscripto en ningún programa.</p></div>`;
    return;
  }

  const hoy = new Date().toISOString().split('T')[0];

  el.innerHTML = progs.map(p => {
    const pct    = p.pct_asistencia;
    const pctCls = pct >= 75 ? 'pct-ok' : pct >= 50 ? 'pct-warn' : 'pct-bad';
    const fill   = Math.min(pct, 100);

    // Dots del calendario
    const dots = p.sesiones.map(s => {
      const f   = s.fecha.substr(8,2) + '/' + s.fecha.substr(5,2);
      const tip = s.asistio === true ? 'asistio' : s.asistio === false ? 'ausente'
                : s.pasada ? 'sin-reg' : 'futura';
      const ico = s.asistio === true ? '✓' : s.asistio === false ? '✗'
                : s.pasada ? '?' : f;
      return `<div class="cal-dot ${tip}" title="${s.fecha_fmt}">${ico}</div>`;
    }).join('');

    return `
    <div class="prog-card">
      <div class="prog-header">
        <div>
          <div class="prog-nombre">${esc(p.nombre)}</div>
          <div class="prog-meta">
            📅 ${esc(p.fecha_inicio)} → ${esc(p.fecha_fin)}
            &nbsp;·&nbsp; ${esc(p.dias_fmt)} &nbsp;·&nbsp; ${p.horas}h por sesión
          </div>
        </div>
        <span class="prog-estado ${p.estado === 'activo' ? 'activo' : 'inactivo'}">
          ${p.estado === 'activo' ? '● Activo' : '○ Inactivo'}
        </span>
      </div>

      <div class="prog-body">
        <!-- Estadísticas -->
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-num">${p.total_sesiones}</div>
            <div class="stat-lbl">Total sesiones</div>
          </div>
          <div class="stat-box">
            <div class="stat-num">${p.asistidas}</div>
            <div class="stat-lbl">Asistidas</div>
          </div>
          <div class="stat-box">
            <div class="stat-num">${p.con_registro - p.asistidas}</div>
            <div class="stat-lbl">Ausencias</div>
          </div>
          <div class="stat-box">
            <div class="stat-num">${p.sesiones_pasadas - p.con_registro}</div>
            <div class="stat-lbl">Sin registro</div>
          </div>
        </div>

        <!-- Barra de asistencia -->
        <div class="pct-bar-wrap ${pctCls}">
          <div class="pct-label">
            <span>Asistencia registrada</span>
            <span class="pct-num">${pct}%</span>
          </div>
          <div class="pct-bar-bg">
            <div class="pct-bar-fill" style="width:${fill}%"></div>
          </div>
          ${p.con_registro > 0 ? `<div style="font-size:.7rem;color:var(--texto-s);margin-top:4px">
            Calculado sobre ${p.con_registro} sesión${p.con_registro!==1?'es':''} con registro
          </div>` : '<div style="font-size:.7rem;color:var(--texto-s);margin-top:4px">Sin sesiones registradas aún</div>'}
        </div>

        <!-- Calendario de sesiones -->
        ${p.sesiones.length ? `
        <div class="cal-label">Calendario de sesiones</div>
        <div class="cal-dots">${dots}</div>
        <div class="cal-leyenda">
          <div class="ley-item"><div class="ley-dot" style="background:rgba(34,197,94,.4)"></div> Asistió</div>
          <div class="ley-item"><div class="ley-dot" style="background:rgba(239,68,68,.4)"></div> Ausente</div>
          <div class="ley-item"><div class="ley-dot" style="background:rgba(245,158,11,.3)"></div> Sin registro</div>
          <div class="ley-item"><div class="ley-dot" style="border:1px dashed var(--borde);background:var(--sup2)"></div> Pendiente</div>
        </div>` : ''}

        ${p.descripcion ? `<div class="prog-desc">📌 ${esc(p.descripcion)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ── CARGAR MENSAJES ────────────────────────────────────────────────────────
async function cargarMensajes() {
  const el = document.getElementById('mensajes-content');
  const r  = await api('GET', `/deportista/comentarios?socio_id=${SOC.socio_id}&club_id=${SOC.club_id}`);
  if (!r || !r.ok) {
    el.innerHTML = `<div class="msg-empty">No se pudieron cargar los mensajes.</div>`;
    return;
  }
  const msgs = r.data;
  if (!msgs.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">💬</div>
      <p class="empty-txt">Aún no hay mensajes de tu entrenador o del club.</p></div>`;
    return;
  }

  // Agrupar por programa
  const grupos = {};
  msgs.forEach(m => {
    if (!grupos[m.programa_id]) grupos[m.programa_id] = { nombre: m.programa_nombre, msgs: [] };
    grupos[m.programa_id].msgs.push(m);
  });

  el.innerHTML = Object.values(grupos).map(g => `
    <div class="msg-prog-group">
      <div class="msg-prog-title">${esc(g.nombre)}</div>
      <div class="msg-list">
        ${g.msgs.map(m => `
        <div class="msg-burbuja ${m.autor === 'admin' ? 'admin' : 'club'}">
          <div class="msg-meta">${esc(m.nombre_autor)} · ${esc(m.fecha)}</div>
          <div class="msg-texto">${esc(m.texto)}</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

// ── RENDER PERFIL ──────────────────────────────────────────────────────────

  el.innerHTML = `
    <div class="perfil-card">

      <div class="perfil-info">

    <div class="sec-title">Información personal</div>
    <div class="perfil-grid">
      <div class="perfil-dato">

        <div class="val">${esc(SOC.cedula)}</div>

      <div class="perfil-dato">

// ── SALIR ──────────────────────────────────────────────────────────────────
function salir() {
  SOC = null;
  document.getElementById('inp-cedula').value = '';
  document.getElementById('s-portal').classList.remove('active');
  document.getElementById('s-login').classList.add('active');
  document.getElementById('tab-programas').style.display = '';
  document.getElementById('tab-mensajes').style.display  = 'none';
  document.getElementById('tab-perfil').style.display    = 'none';
  document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('active', i===0));
}
</script>
