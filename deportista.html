<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKA Ecuador — Portal del Deportista</title>
<style>
/* ── MODO OSCURO (defecto) ── */
:root {
  --fondo:#070E1C;--sup:#0C1829;--sup2:#112035;--primario:#14306A;
  --primario-dark:#0C1F4A;--acento:#4A8FE8;--texto:#DDE8F8;--texto-s:#6E90B8;
  --borde:#182C48;--exito:#22C55E;--peligro:#EF4444;--naranja:#F59E0B;--blanco:#FFFFFF;
  --login-grad:radial-gradient(ellipse at 40% 30%,#0C2055 0%,#070E1C 70%);
  --shadow:0 20px 60px rgba(0,0,0,.5);
}
/* ── MODO CLARO ── */
body.claro {
  --fondo:#F0F4F8;--sup:#FFFFFF;--sup2:#E8EEF5;--primario:#1A3A6B;
  --primario-dark:#0F2347;--acento:#2563EB;--texto:#1E293B;--texto-s:#64748B;
  --borde:#CBD5E1;--exito:#16A34A;--peligro:#DC2626;--naranja:#D97706;--blanco:#FFFFFF;
  --login-grad:radial-gradient(ellipse at 40% 30%,#DBEAFE 0%,#F0F4F8 70%);
  --shadow:0 20px 60px rgba(0,0,0,.1);
}
body.claro .toast-ok{background:#DCFCE7;color:#16A34A}
body.claro .toast-err{background:#FEE2E2;color:#DC2626}
body.claro .msg-burbuja.admin{background:var(--primario);color:var(--blanco)}
body.claro .msg-burbuja.club{background:#EFF6FF;border-color:#BFDBFE;color:#1E293B}
body.claro .msg-texto{color:inherit}

*{box-sizing:border-box;margin:0;padding:0;transition:background-color .25s,color .25s,border-color .25s}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh}

/* TOAST */
#toast{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{padding:11px 16px;border-radius:8px;font-size:.84rem;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.3);animation:slideIn .3s ease;max-width:300px}
.toast-ok{background:#0D3320;border:1px solid var(--exito);color:var(--exito)}
.toast-err{background:#2A0D0D;border:1px solid var(--peligro);color:var(--peligro)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* ── LOGIN ── */
#s-login{align-items:center;justify-content:center;background:var(--login-grad)}
.login-card{background:var(--sup);border:1px solid var(--borde);border-radius:18px;
  padding:44px 36px;width:min(380px,92vw);text-align:center;box-shadow:var(--shadow)}
.login-logo{font-size:3rem;margin-bottom:8px}
.login-org{font-size:.72rem;letter-spacing:.14em;color:var(--texto-s);text-transform:uppercase;margin-bottom:6px}
.login-title{font-size:1.5rem;font-weight:700;color:var(--texto);margin-bottom:4px}
.login-sub{font-size:.82rem;color:var(--texto-s);margin-bottom:30px}
.login-card label{display:block;font-size:.72rem;font-weight:600;color:var(--texto-s);
  text-transform:uppercase;letter-spacing:.08em;text-align:left;margin-bottom:6px}
.login-card input{width:100%;background:var(--sup2);border:1px solid var(--borde);
  color:var(--texto);padding:13px 16px;border-radius:10px;font-size:1rem;outline:none;
  font-family:inherit;text-align:center}
.login-card input:focus{border-color:var(--acento)}
.login-card input::placeholder{color:var(--texto-s)}
.btn-login{width:100%;margin-top:20px;padding:14px;background:var(--acento);
  color:var(--blanco);border:none;border-radius:10px;font-size:.95rem;font-weight:700;
  cursor:pointer;font-family:inherit}
.btn-login:hover{opacity:.9}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-badge{margin-top:24px;font-size:.72rem;color:var(--texto-s);
  display:flex;align-items:center;justify-content:center;gap:6px}
.login-badge::before,.login-badge::after{content:'';flex:1;height:1px;background:var(--borde)}

/* ── HEADER ── */
.header{background:var(--primario-dark);border-bottom:1px solid var(--borde);
  display:flex;align-items:center;padding:10px 20px;gap:12px;position:sticky;top:0;z-index:100}
.header-logo{font-size:1.05rem;font-weight:800;color:var(--acento)}
.header-sep{flex:1}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--acento);
  display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:var(--blanco)}
.header-name{font-size:.88rem;font-weight:600;color:var(--blanco);line-height:1.2}
.header-cat{font-size:.72rem;color:rgba(255,255,255,.5)}
.btn-icon{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);
  padding:6px 10px;border-radius:7px;cursor:pointer;font-size:.82rem;font-family:inherit}
.btn-icon:hover{border-color:var(--acento);color:var(--acento)}
.btn-salir{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);
  padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.78rem;font-family:inherit}
.btn-salir:hover{border-color:var(--peligro);color:var(--peligro)}

/* TABS */
.tabs{display:flex;background:var(--sup);border-bottom:1px solid var(--borde);padding:0 20px}
.tab{padding:12px 18px;font-size:.84rem;font-weight:600;color:var(--texto-s);cursor:pointer;
  border:none;background:none;font-family:inherit;border-bottom:2px solid transparent}
.tab.active{color:var(--acento);border-bottom-color:var(--acento)}
.tab:hover:not(.active){color:var(--texto)}

.main{flex:1;padding:20px;max-width:960px;width:100%;margin:0 auto}

/* PROGRAMA */
.prog-card{background:var(--sup);border:1px solid var(--borde);border-radius:14px;
  margin-bottom:20px;overflow:hidden}
.prog-header{padding:16px 20px;background:var(--primario-dark);display:flex;
  align-items:flex-start;justify-content:space-between;gap:12px}
.prog-nombre{font-size:1rem;font-weight:700;color:var(--blanco)}
.prog-meta{font-size:.76rem;color:rgba(255,255,255,.5);margin-top:4px;line-height:1.7}
.prog-estado{padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:700;flex-shrink:0;margin-top:2px}
.prog-estado.activo{background:rgba(34,197,94,.2);color:var(--exito);border:1px solid rgba(34,197,94,.4)}
.prog-estado.inactivo{background:rgba(100,100,100,.15);color:var(--texto-s);border:1px solid var(--borde)}
.prog-body{padding:18px 20px;display:flex;flex-direction:column;gap:18px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-box{background:var(--sup2);border-radius:10px;padding:12px 10px;text-align:center}
.stat-num{font-size:1.4rem;font-weight:800;color:var(--acento)}
.stat-lbl{font-size:.66rem;color:var(--texto-s);margin-top:2px}

/* BARRA */
.pct-bar-wrap{display:flex;flex-direction:column;gap:6px}
.pct-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--texto-s)}
.pct-num{font-weight:700;font-size:.88rem}
.pct-bar-bg{height:8px;background:var(--borde);border-radius:4px;overflow:hidden}
.pct-bar-fill{height:100%;border-radius:4px}
.pct-sub{font-size:.7rem;color:var(--texto-s)}
.pct-ok .pct-num{color:var(--exito)}     .pct-ok .pct-bar-fill{background:var(--exito)}
.pct-warn .pct-num{color:var(--naranja)} .pct-warn .pct-bar-fill{background:var(--naranja)}
.pct-bad .pct-num{color:var(--peligro)}  .pct-bad .pct-bar-fill{background:var(--peligro)}

/* ── CALENDARIO NAVEGABLE ── */
.cal-wrap{background:var(--sup2);border-radius:12px;padding:14px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-title{font-size:.92rem;font-weight:700;color:var(--texto)}
.cal-nav-btn{background:var(--sup);border:1px solid var(--borde);color:var(--texto-s);
  width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;font-family:inherit}
.cal-nav-btn:hover:not(:disabled){border-color:var(--acento);color:var(--acento)}
.cal-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;
  background:var(--borde);border-radius:8px;overflow:hidden}
.cal-th{background:var(--primario-dark);padding:7px 4px;font-size:.62rem;font-weight:700;
  color:rgba(255,255,255,.6);text-align:center;text-transform:uppercase}
.cal-day{background:var(--sup);padding:8px 4px;text-align:center;font-size:.72rem;
  min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal-day.vacio{background:var(--fondo)}
.cal-day.normal{color:var(--texto-s);opacity:.4}
.cal-day.asistio{background:rgba(34,197,94,.18);color:var(--exito)}
.cal-day.ausente{background:rgba(239,68,68,.18);color:var(--peligro)}
.cal-day.sinreg{background:rgba(245,158,11,.14);color:var(--naranja)}
.cal-day.futura{background:rgba(74,143,232,.08);color:var(--acento)}
.cal-ico{font-size:.9rem;font-weight:700;line-height:1}
.cal-num{font-size:.6rem;opacity:.7;line-height:1}
.cal-ley{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.ley-item{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--texto-s)}
.ley-sq{width:11px;height:11px;border-radius:3px}

/* MENSAJES */
.msgs-wrap{background:var(--sup2);border-radius:12px;padding:14px}
.msgs-title{font-size:.72rem;font-weight:700;color:var(--texto-s);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:10px}
.msg-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.msg-burbuja{max-width:88%;padding:10px 14px;border-radius:12px;line-height:1.5}
.msg-burbuja.admin{background:var(--primario);border-bottom-left-radius:4px}
.msg-burbuja.club{background:rgba(74,143,232,.1);border:1px solid rgba(74,143,232,.2);border-bottom-left-radius:4px}
.msg-meta{font-size:.66rem;margin-bottom:4px;font-weight:600;color:rgba(255,255,255,.4)}
.msg-burbuja.admin .msg-meta{color:rgba(74,143,232,.8)}
.msg-texto{font-size:.85rem;color:var(--blanco)}
.msgs-empty{font-size:.78rem;color:var(--texto-s);text-align:center;padding:14px}

/* COMPAÑEROS */
.comp-wrap{background:var(--sup2);border-radius:12px;padding:14px}
.comp-title{font-size:.72rem;font-weight:700;color:var(--texto-s);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:10px}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.comp-chip{background:var(--sup);border:1px solid var(--borde);border-radius:9px;
  padding:8px 10px;display:flex;align-items:center;gap:8px}
.comp-ini{width:28px;height:28px;border-radius:6px;background:var(--primario);
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--acento);flex-shrink:0}
.comp-nom{font-size:.76rem;font-weight:600;color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-cat{font-size:.64rem;color:var(--texto-s)}
.prog-desc{font-size:.82rem;color:var(--texto-s);line-height:1.6;padding:12px 14px;
  background:var(--sup2);border-radius:10px;border-left:3px solid var(--acento)}

/* PERFIL */
.perfil-card{background:var(--sup);border:1px solid var(--borde);border-radius:14px;
  padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:20px}
.perfil-av{width:68px;height:68px;border-radius:14px;background:var(--primario);
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;
  color:var(--acento);border:2px solid var(--acento)}
.perfil-info h2{font-size:1.2rem;font-weight:700;color:var(--texto)}
.perfil-info p{font-size:.82rem;color:var(--texto-s);margin-top:3px}
.perfil-badge{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:20px;
  font-size:.72rem;font-weight:700;background:rgba(74,143,232,.15);color:var(--acento);
  border:1px solid rgba(74,143,232,.3)}
.sec-title{font-size:.72rem;font-weight:700;color:var(--texto-s);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--borde)}
.perfil-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.perfil-dato{background:var(--sup2);border-radius:10px;padding:12px 14px}
.perfil-dato .lbl{font-size:.68rem;font-weight:600;color:var(--texto-s);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:4px}
.perfil-dato .val{font-size:.88rem;color:var(--texto);font-weight:500}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px;gap:14px;color:var(--texto-s);font-size:.88rem}
.spinner{width:36px;height:36px;border:3px solid var(--borde);
  border-top-color:var(--acento);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:50px 20px;color:var(--texto-s)}
.empty-icon{font-size:2.8rem;margin-bottom:12px}
.empty-txt{font-size:.9rem}

@media(max-width:500px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .cal-day{min-height:40px}
}
</style>
</head>
<body>
<div id="toast"></div>

<!-- LOGIN -->
<div class="screen active" id="s-login">
  <div class="login-card">
    <div class="login-logo">🥋</div>
    <div class="login-org">IKA Ecuador</div>
    <h1 class="login-title">Portal del Deportista</h1>
    <p class="login-sub">Consultá tus programas, asistencias y mensajes</p>
    <label for="inp-cedula">Número de Cédula</label>
    <input id="inp-cedula" type="text" placeholder="Ej: 1712345678"
           maxlength="20" autocomplete="off" inputmode="numeric"
           onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn-login" id="btn-login" onclick="doLogin()">Ingresar</button>
    <p class="login-badge">Solo lectura · Tus datos son privados</p>
  </div>
</div>

<!-- PORTAL -->
<div class="screen" id="s-portal">
  <header class="header">
    <div class="header-logo">🥋 IKA Ecuador</div>
    <div class="header-sep"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-icon" id="btn-modo" onclick="toggleModo()" title="Cambiar modo">☀️</button>
      <div class="avatar" id="hdr-avatar">?</div>
      <div>
        <div class="header-name" id="hdr-name">—</div>
        <div class="header-cat"  id="hdr-cat">—</div>
      </div>
      <button class="btn-salir" onclick="salir()">Salir</button>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab active" onclick="showTab('programas',this)">📋 Mis Programas</button>
    <button class="tab" onclick="showTab('perfil',this)">👤 Mi Perfil</button>
  </nav>
  <div class="main">
    <div id="tab-programas">
      <div id="programas-content">
        <div class="loading"><div class="spinner"></div>Cargando...</div>
      </div>
    </div>
    <div id="tab-perfil" style="display:none">
      <div id="perfil-content"></div>
    </div>
  </div>
</div>

<script>
let SOC=null, MSGS={}, SESIONES_MAP={};
let modoClaro = false;
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const DIAS=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
const MNOM=['Enero','Febrero','Marzo','Abril','Mayo','Junio',
            'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function toggleModo(){
  modoClaro=!modoClaro;
  document.body.classList.toggle('claro',modoClaro);
  document.getElementById('btn-modo').textContent=modoClaro?'🌙':'☀️';
  // Re-renderizar calendarios con el nuevo tema
  document.querySelectorAll('.cal-wrap').forEach(w=>{
    const pid=w.dataset.pid;
    const state=calState[pid];
    if(state) renderCalMes(pid,state.anio,state.mes);
  });
}

function toast(msg,tipo='ok',ms=3000){
  const c=document.getElementById('toast');
  const d=document.createElement('div');
  d.className=`toast-item toast-${tipo}`;d.textContent=msg;c.appendChild(d);
  setTimeout(()=>{d.style.animation='fadeOut .4s forwards';setTimeout(()=>d.remove(),400);},ms);
}
async function api(method,url,body=null){
  try{
    const opts={method,headers:{'Content-Type':'application/json'}};
    if(body) opts.body=JSON.stringify(body);
    const r=await fetch(url,opts);
    const data=await r.json();
    return{ok:r.ok,data};
  }catch(e){toast('Error de conexión.','err');return null;}
}
function showTab(id,btn){
  ['programas','perfil'].forEach(t=>
    document.getElementById(`tab-${t}`).style.display=t===id?'':'none');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ── ESTADO DEL CALENDARIO POR PROGRAMA ──
const calState={};  // {prog_id: {anio, mes}}

function navCal(pid, delta){
  let {anio,mes}=calState[pid];
  mes+=delta;
  if(mes>11){mes=0;anio++;}
  if(mes<0){mes=11;anio--;}
  calState[pid]={anio,mes};
  renderCalMes(pid,anio,mes);
}

function renderCalMes(pid, anio, mes){
  const wrap=document.getElementById(`cal-${pid}`);
  if(!wrap) return;
  const sesiones=SESIONES_MAP[pid]||[];
  const hoy=new Date().toISOString().split('T')[0];

  // Índice de sesiones del mes
  const sesByDia={};
  sesiones.forEach(s=>{
    const sm=s.fecha.substr(0,7);
    const sanio=parseInt(s.fecha.substr(0,4));
    const smes=parseInt(s.fecha.substr(5,2))-1;
    if(sanio===anio && smes===mes){
      sesByDia[parseInt(s.fecha.substr(8,2))]=s;
    }
  });

  // Rango de meses disponibles
  const mesesDisp=[...new Set(sesiones.map(s=>s.fecha.substr(0,7)))].sort();
  const mesActualStr=`${anio}-${String(mes+1).padStart(2,'0')}`;
  const idxActual=mesesDisp.indexOf(mesActualStr);
  const canPrev=idxActual>0 || mesesDisp.some(m=>m<mesActualStr);
  const canNext=idxActual<mesesDisp.length-1 || mesesDisp.some(m=>m>mesActualStr);

  const primerDia=new Date(anio,mes,1).getDay();
  const offset=(primerDia+6)%7;
  const diasMes=new Date(anio,mes+1,0).getDate();

  let celdas=DIAS.map(d=>`<div class="cal-th">${d}</div>`);
  for(let i=0;i<offset;i++) celdas.push(`<div class="cal-day vacio"></div>`);

  for(let d=1;d<=diasMes;d++){
    const s=sesByDia[d];
    if(s){
      const cls=s.asistio===true?'asistio':s.asistio===false?'ausente':s.pasada?'sinreg':'futura';
      const ico=s.asistio===true?'✓':s.asistio===false?'✗':s.pasada?'·':'⟳';
      celdas.push(`<div class="cal-day ${cls}" title="${s.fecha_fmt}">
        <span class="cal-ico">${ico}</span><span class="cal-num">${d}</span>
      </div>`);
    } else {
      celdas.push(`<div class="cal-day normal"><span class="cal-num">${d}</span></div>`);
    }
  }

  wrap.innerHTML=`
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="navCal('${pid}',-1)" ${!canPrev?'disabled':''}>◀</button>
      <span class="cal-nav-title">${MNOM[mes]} ${anio}</span>
      <button class="cal-nav-btn" onclick="navCal('${pid}',1)"  ${!canNext?'disabled':''}>▶</button>
    </div>
    <div class="cal-grid">${celdas.join('')}</div>
    <div class="cal-ley">
      <div class="ley-item"><div class="ley-sq" style="background:rgba(34,197,94,.4)"></div>Asistió</div>
      <div class="ley-item"><div class="ley-sq" style="background:rgba(239,68,68,.4)"></div>Ausente</div>
      <div class="ley-item"><div class="ley-sq" style="background:rgba(245,158,11,.3)"></div>Sin registro</div>
      <div class="ley-item"><div class="ley-sq" style="background:rgba(74,143,232,.15);border:1px dashed rgba(74,143,232,.5)"></div>Pendiente</div>
    </div>`;
}

// ── LOGIN ──
async function doLogin(){
  const cedula=document.getElementById('inp-cedula').value.trim();
  if(!cedula){toast('Ingresá tu cédula.','err');return;}
  const btn=document.getElementById('btn-login');
  btn.disabled=true;btn.textContent='Verificando...';
  const r=await api('POST','/deportista/login',{cedula});
  btn.disabled=false;btn.textContent='Ingresar';
  if(!r)return;
  if(!r.ok){toast(r.data.error||'Cédula no encontrada.','err');return;}
  SOC=r.data;
  const ini=(SOC.nombres[0]||'?')+(SOC.apellidos[0]||'');
  document.getElementById('hdr-avatar').textContent=ini.toUpperCase();
  document.getElementById('hdr-name').textContent=`${SOC.nombres} ${SOC.apellidos}`;
  document.getElementById('hdr-cat').textContent=`${SOC.categoria} · ${SOC.club_nombre}`;
  document.getElementById('s-login').classList.remove('active');
  document.getElementById('s-portal').classList.add('active');
  cargarTodo();renderPerfil();
}

// ── CARGAR TODO ──
async function cargarTodo(){
  const el=document.getElementById('programas-content');
  const [rP,rM]=await Promise.all([
    api('GET',`/deportista/programas?socio_id=${SOC.socio_id}&club_id=${SOC.club_id}`),
    api('GET',`/deportista/comentarios?socio_id=${SOC.socio_id}&club_id=${SOC.club_id}`)
  ]);
  if(!rP||!rP.ok){
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div>
      <p class="empty-txt">${esc(rP?.data?.error||'Error.')}</p></div>`;return;
  }
  const progs=rP.data;
  MSGS={};
  if(rM&&rM.ok) rM.data.forEach(m=>{
    if(!MSGS[m.programa_id])MSGS[m.programa_id]=[];MSGS[m.programa_id].push(m);
  });
  if(!progs.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div>
      <p class="empty-txt">Aún no estás inscripto en ningún programa.</p></div>`;return;
  }
  // Guardar sesiones indexadas por programa
  progs.forEach(p=>{SESIONES_MAP[p.id]=p.sesiones;});

  const compReqs=await Promise.all(
    progs.map(p=>api('GET',`/deportista/companeros?prog_id=${p.id}&club_id=${SOC.club_id}`))
  );
  const compMap={};
  progs.forEach((p,i)=>compMap[p.id]=compReqs[i]?.ok?compReqs[i].data:[]);
  const hoy=new Date().toISOString().split('T')[0];

  // Inicializar estado del calendario en el mes más reciente con sesiones
  progs.forEach(p=>{
    const fechas=p.sesiones.map(s=>s.fecha).sort();
    const ultima=fechas[fechas.length-1]||hoy;
    calState[p.id]={anio:parseInt(ultima.substr(0,4)),mes:parseInt(ultima.substr(5,2))-1};
  });

  el.innerHTML=progs.map(p=>renderProg(p,compMap[p.id]||[])).join('');

  // Renderizar calendarios
  progs.forEach(p=>{
    const {anio,mes}=calState[p.id];
    renderCalMes(p.id,anio,mes);
  });
}

function renderProg(p,comp){
  const pct=p.pct_asistencia;
  const cls=pct>=75?'pct-ok':pct>=50?'pct-warn':'pct-bad';
  const msgs=MSGS[p.id]||[];
  const msgsH=msgs.length
    ?msgs.map(m=>`<div class="msg-burbuja ${m.autor==='admin'?'admin':'club'}">
        <div class="msg-meta">${esc(m.nombre_autor)} · ${esc(m.fecha)}</div>
        <div class="msg-texto">${esc(m.texto)}</div>
      </div>`).join('')
    :`<div class="msgs-empty">Sin mensajes aún.</div>`;
  const yo=`${SOC.nombres} ${SOC.apellidos}`.toLowerCase();
  const compH=comp.filter(c=>`${c.nombres} ${c.apellidos}`.toLowerCase()!==yo)
    .map(c=>{
      const ini=(c.nombres[0]||'')+(c.apellidos[0]||'');
      return`<div class="comp-chip">
        <div class="comp-ini">${esc(ini.toUpperCase())}</div>
        <div><div class="comp-nom">${esc(c.apellidos)}, ${esc(c.nombres)}</div>
        <div class="comp-cat">${esc(c.categoria)}</div></div>
      </div>`;
    }).join('')||`<div class="msgs-empty">Solo vos en este programa.</div>`;

  return`<div class="prog-card">
    <div class="prog-header">
      <div>
        <div class="prog-nombre">${esc(p.nombre)}</div>
        <div class="prog-meta">📅 ${esc(p.fecha_inicio)} → ${esc(p.fecha_fin)}<br>
          📆 ${esc(p.dias_fmt)} · ${p.horas}h/sesión</div>
      </div>
      <span class="prog-estado ${p.estado==='activo'?'activo':'inactivo'}">
        ${p.estado==='activo'?'● Activo':'○ Inactivo'}</span>
    </div>
    <div class="prog-body">
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num">${p.total_sesiones}</div><div class="stat-lbl">Total</div></div>
        <div class="stat-box"><div class="stat-num">${p.asistidas}</div><div class="stat-lbl">Asistidas</div></div>
        <div class="stat-box"><div class="stat-num">${p.con_registro-p.asistidas}</div><div class="stat-lbl">Ausencias</div></div>
        <div class="stat-box"><div class="stat-num">${p.sesiones_pasadas-p.con_registro}</div><div class="stat-lbl">Sin registro</div></div>
      </div>
      <div class="pct-bar-wrap ${cls}">
        <div class="pct-label"><span>Asistencia registrada</span><span class="pct-num">${pct}%</span></div>
        <div class="pct-bar-bg"><div class="pct-bar-fill" style="width:${Math.min(pct,100)}%"></div></div>
        <div class="pct-sub">${p.con_registro>0?`Basado en ${p.con_registro} sesión${p.con_registro!==1?'es':''} con registro`:'Sin sesiones registradas aún'}</div>
      </div>
      <!-- Calendario navegable -->
      <div class="cal-wrap" data-pid="${p.id}">
        <div id="cal-${p.id}"><div class="loading" style="padding:20px"><div class="spinner"></div></div></div>
      </div>
      <div class="msgs-wrap">
        <div class="msgs-title">💬 Mensajes de tu entrenador</div>
        <div class="msg-list">${msgsH}</div>
      </div>
      <div class="comp-wrap">
        <div class="comp-title">👥 Compañeros · ${comp.length} inscriptos</div>
        <div class="comp-grid">${compH}</div>
      </div>
      ${p.descripcion?`<div class="prog-desc">📌 ${esc(p.descripcion)}</div>`:''}
    </div>
  </div>`;
}

function renderPerfil(){
  const ini=(SOC.nombres[0]||'')+(SOC.apellidos[0]||'');
  document.getElementById('perfil-content').innerHTML=`
    <div class="perfil-card">
      <div class="perfil-av">${esc(ini.toUpperCase())}</div>
      <div class="perfil-info">
        <h2>${esc(SOC.nombres)} ${esc(SOC.apellidos)}</h2>
        <p>${esc(SOC.club_nombre)}</p>
        <span class="perfil-badge">${esc(SOC.categoria)}</span>
      </div>
    </div>
    <div class="sec-title">Información personal</div>
    <div class="perfil-grid">
      <div class="perfil-dato"><div class="lbl">Cédula</div><div class="val">${esc(SOC.cedula)}</div></div>
      <div class="perfil-dato"><div class="lbl">Teléfono</div><div class="val">${esc(SOC.telefono||'—')}</div></div>
      <div class="perfil-dato"><div class="lbl">Correo</div><div class="val" style="word-break:break-all">${esc(SOC.correo||'—')}</div></div>
      <div class="perfil-dato"><div class="lbl">Ciudad</div><div class="val">${esc(SOC.ciudad||'—')}</div></div>
      <div class="perfil-dato"><div class="lbl">Fecha de ingreso</div><div class="val">${esc(SOC.fecha_ingreso||'—')}</div></div>
    </div>`;
}

function salir(){
  SOC=null;MSGS={};SESIONES_MAP={};
  document.getElementById('inp-cedula').value='';
  document.getElementById('s-portal').classList.remove('active');
  document.getElementById('s-login').classList.add('active');
  document.getElementById('tab-programas').style.display='';
  document.getElementById('tab-perfil').style.display='none';
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===0));
}
</script>
